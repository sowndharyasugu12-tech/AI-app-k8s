apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-ai-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamlit-ai-agent
  template:
    metadata:
      labels:
        app: streamlit-ai-agent
    spec:
      containers:
      - name: streamlit-agent
        image: 9500588005/0517:ai-app
        ports:
        - containerPort: 8501
        env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: abu
              key: chandan

